<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор 5% з округленням до 100</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
    }
    label, input, button {
      font-size: 16px;
    }
    input {
      padding: 6px 10px;
      width: 100%;
      max-width: 300px;
      box-sizing: border-box;
      margin-top: 4px;
    }
    button {
      margin-top: 12px;
      padding: 8px 16px;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      background: #f3f4f6;
    }
    .error {
      color: #b91c1c;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Калькулятор 5% з округленням до 100</h1>

  <label for="amount">Введіть суму:</label><br>
  <input type="text" id="amount" placeholder="Наприклад, 17300"><br>
  <button type="button" onclick="calculate()">Розрахувати</button>

  <div id="error" class="error"></div>

  <div id="result" class="result" style="display:none;">
    <p>5% від суми: <strong><span id="raw"></span></strong></p>
    <p>Округлено до 100: <strong><span id="rounded"></span></strong></p>
  </div>

  <script>
    function formatNumber(num) {
      // просте форматування з пробілами як розділювачем тисяч
      return num.toLocaleString('uk-UA', { maximumFractionDigits: 2 });
    }

    function calculate() {
      const inputEl = document.getElementById('amount');
      const errorEl = document.getElementById('error');
      const resultBox = document.getElementById('result');
      const rawEl = document.getElementById('raw');
      const roundedEl = document.getElementById('rounded');

      errorEl.textContent = '';
      resultBox.style.display = 'none';

      // підтримка коми як роздільника
      const rawValue = inputEl.value.replace(',', '.').trim();
      const amount = parseFloat(rawValue);

      if (isNaN(amount) || amount < 0) {
        errorEl.textContent = 'Будь ласка, введіть коректне додатне число.';
        return;
      }

      const percent5 = amount * 0.05;
      const roundedTo100 = Math.round(percent5 / 100) * 100;

      rawEl.textContent = formatNumber(percent5);
      roundedEl.textContent = formatNumber(roundedTo100);

      resultBox.style.display = 'block';
    }
  </script>
</body>
</html>
